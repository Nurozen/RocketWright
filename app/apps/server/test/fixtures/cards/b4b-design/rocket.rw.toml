name = "Rocket"

[c.nose]
type = "nose_cone"
material = "polystyrene"
shape = "ogive"
length = "100 mm"
od = "24.8 mm"

[c.body]
type = "body_tube"
attach = { to = "nose.base" }
material = "cardboard"
length = "350 mm"
od = "24.8 mm"
id = "24.1 mm"

[c.fins]
type = "trapezoidal_fin_set"
attach = { to = "body.aft", at = "root_te" }
material = "balsa"
count = 3
root_chord = "60 mm"
tip_chord = "30 mm"
span = "45 mm"
sweep = "30 mm"
thickness = "2.4 mm"

[c.mount]
type = "inner_tube"
attach = { to = "body.aft", at = "aft" }
material = "cardboard"
length = "70 mm"
od = "19.6 mm"
id = "18.8 mm"
motor_mount = true

[c.streamer]
type = "streamer"
attach = { to = "body.fore", at = "attach", offset = "30 mm" }
material = "ripstop_nylon"
length = "600 mm"
width = "50 mm"
packed_length = "30 mm"
packed_diameter = "18 mm"

[materials.polystyrene]
density = "1050 kg/m^3"

[materials.cardboard]
density = "680 kg/m^3"

[materials.balsa]
density = "160 kg/m^3"

[materials.ripstop_nylon]
surface_density = "67 g/m^2"
