# Oracle case 1 ("A simple model rocket", generic-curve variant), re-authored
# from tests/oracle/case1.geometry.json (plan M1.54b). Every golden input
# evaluates to the golden value (crates/rw-model/src/components/case1.rs).
# configs/ and sims/ are generated by scripts/fixtures/case1-from-golden.ts.

name = "A simple model rocket"

[c.nose]
type = "nose_cone"
name = "Nose cone"
material = "polystyrene"
finish = { roughness = "60 um" }
shape = "ogive"
shape_param = 1
length = "100 mm"
od = "25 mm"
thickness = "2 mm"
shoulder = { length = "20 mm", od = "23 mm", thickness = "2 mm", capped = true }

[c.body]
type = "body_tube"
name = "Body tube"
attach = { to = "nose.base" }
material = "cardboard"
finish = { roughness = "60 um" }
length = "300 mm"
od = "25 mm"
thickness = "1 mm"

[c.chute]
type = "parachute"
name = "Parachute"
attach = { to = "body.fore", at = "attach", offset = "32 mm" }
material = "ripstop_nylon"
diameter = "300 mm"
cd = 0.8
line_count = 6
line_length = "300 mm"
line_material = "elastic_cord"
packed_length = "42 mm"
packed_diameter = "18 mm"

[c.cord]
type = "shock_cord"
name = "Shock cord"
attach = { to = "body.fore", at = "attach", offset = "20 mm" }
material = "elastic_cord"
cord_length = "400 mm"
packed_length = "52 mm"
packed_diameter = "12 mm"

[c.wadding]
type = "mass_component"
name = "Wadding"
attach = { to = "body.fore", at = "fore", offset = "80 mm" }
mass = "2 g"
length = "30 mm"
od = "23 mm"

[c.lug]
type = "launch_lug"
name = "Launch lug"
attach = { to = "body.mid", at = "fore", offset = "-17.5 mm", spin = "19 deg" }
material = "cardboard"
finish = { roughness = "60 um" }
length = "35 mm"
od = "7 mm"
thickness = "1 mm"

[c.fins]
type = "trapezoidal_fin_set"
name = "Trapezoidal fin set"
attach = { to = "body.aft", at = "root_te" }
material = "cardboard"
finish = { roughness = "60 um" }
count = 3
root_chord = "50.8 mm"
tip_chord = "50.8 mm"
span = "30 mm"
sweep = "25.4 mm"
thickness = "2 mm"
# Not in the oracle geometry; rounded reproduces the golden base drag
# (docs/dev/parity-log.md, rw-aero M1.37/M1.38 and M1.42).
cross_section = "rounded"
tab = { height = "0 mm", length = "50 mm" }

[c.ring_fore]
type = "centering_ring"
name = "Centering ring"
attach = { to = "body.aft", at = "fore", offset = "-47 mm" }
material = "cardboard"
length = "2 mm"
od = "23 mm"
id = "19 mm"

[c.ring_aft]
type = "centering_ring"
name = "Centering ring"
attach = { to = "body.aft", at = "aft" }
material = "cardboard"
length = "2 mm"
od = "23 mm"
id = "19 mm"

[c.mmt]
type = "inner_tube"
name = "Inner Tube"
attach = { to = "body.aft", at = "aft", offset = "5 mm" }
material = "cardboard"
length = "75 mm"
od = "19 mm"
thickness = "0.5 mm"
motor_mount = true
overhang = "3 mm"

[c.block]
type = "engine_block"
name = "Engine block"
attach = { to = "mmt.inner", at = "fore", offset = "2 mm" }
material = "cardboard"
length = "5 mm"
od = "18 mm"
id = "12 mm"

[materials.polystyrene]
density = "1050 kg/m^3"

[materials.cardboard]
density = "680 kg/m^3"

[materials.ripstop_nylon]
surface_density = "67 g/m^2"

[materials.elastic_cord]
line_density = "1.8 g/m"
