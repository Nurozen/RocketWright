  <path d="M 300 70 L 340 30 L 360 30 L 360 70 Z" fill="#ff7a1a" fill-opacity="0.85"/>
  <path d="M 300 130 L 340 170 L 360 170 L 360 130 Z" fill="#ff7a1a" fill-opacity="0.85"/>
