      <stop offset="0" stop-color="#d7dde6"/>
      <stop offset="1" stop-color="#5b6675"/>
    </linearGradient>
  </defs>
  <rect width="480" height="200" fill="#0f1216"/>
  <path d="M 40 100 Q 80 70 130 70 L 360 70 L 360 130 L 130 130 Q 80 130 40 100 Z"
