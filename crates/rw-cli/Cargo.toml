[package]
name = "rw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rocketwright"
path = "src/main.rs"

[features]
# Contract-fixture doubles for tool and resource bodies (stub-first rule).
# Test builds only: enabled through the dev-dependency below; `xtask audit`
# fails if a non-test build turns it on.
doubles = []
# Native NASA CEA for propellants outside the shipped tables (plan M4.6);
# needs gfortran + cmake (docs/dev/environment.md).
cea = ["rw-project/cea", "rw-cea-sys/cea"]

[dependencies]
rw-api.workspace = true
rw-project.workspace = true
rw-cea-sys.workspace = true
rw-model.workspace = true
rw-check.workspace = true
rw-draw.workspace = true
rw-geom.workspace = true
rw-sim.workspace = true
rw-units.workspace = true
rw-liquid.workspace = true
toml.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
clap.workspace = true
rmcp.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "signal"] }
anyhow.workspace = true
blake3.workspace = true
resvg.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
sha2.workspace = true
rw-cli = { path = ".", features = ["doubles"] }
