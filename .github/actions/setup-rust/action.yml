name: Setup Rust
description: The rust-toolchain.toml toolchain, the cargo cache, and optionally the pinned wasm-bindgen CLI.
inputs:
  cache-key:
    description: Cache key suffix (one per job, so each job keeps its own target dir).
    required: true
  wasm-bindgen:
    description: Install wasm-bindgen-cli at the crate pin (make wasm).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # rustup 1.28+ installs the toolchain rust-toolchain.toml names (channel,
    # targets, components) only when asked.
    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustup show active-toolchain
        cargo --version

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        cache-bin: "false"

    - name: Resolve the wasm-bindgen pin
      id: wasm_bindgen
      if: inputs.wasm-bindgen == 'true'
      shell: bash
      run: echo "version=$(sed -n 's/^wasm-bindgen *= *"=\([0-9.]*\)".*/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

    - name: Cache wasm-bindgen
      id: wasm_bindgen_cache
      if: inputs.wasm-bindgen == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.wasm_bindgen.outputs.version }}

    - name: Install wasm-bindgen
      if: inputs.wasm-bindgen == 'true' && steps.wasm_bindgen_cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-bindgen-cli --version "${{ steps.wasm_bindgen.outputs.version }}" --locked --bin wasm-bindgen
